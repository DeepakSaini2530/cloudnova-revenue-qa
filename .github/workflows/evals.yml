name: evals

on: [push, pull_request]

jobs:
  offline:
    # Pipeline invariants, reference answers and guardrails. No model or secrets needed.
    # The natural-language cases need a logged-in Claude Code CLI, so they run locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m evals --offline
